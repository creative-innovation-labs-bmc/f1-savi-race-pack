name: FantasyGP current-state probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-current-state-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture current account state read-only
        shell: bash
        run: |
          mkdir -p build/current-state
          python - <<'PY'
          import asyncio, json, os, re, sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'scripts')
          from fantasygp_auth_runner import authenticated_login
          OUT=Path('build/current-state')
          async def snap(page,name,url):
              await page.goto(url,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(2500)
              body=await page.locator('body').inner_text()
              (OUT/f'{name}.txt').write_text(body,encoding='utf-8')
              (OUT/f'{name}.html').write_text(await page.content(),encoding='utf-8')
              await page.screenshot(path=str(OUT/f'{name}.png'),full_page=True)
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True)
              c=await b.new_context(viewport={'width':1600,'height':1200})
              page=await c.new_page()
              await authenticated_login(page,league_url='https://fantasygp.com/league/?lid=10527',username=os.environ['FANTASYGP_USERNAME'],password=os.environ['FANTASYGP_PASSWORD'])
              await snap(page,'team','https://fantasygp.com/team/')
              await snap(page,'predictions','https://fantasygp.com/predictions/')
              # open one current driver tile and one current car tile to expose full market choices, without selecting/saving
              for label,kind in [('Antonelli','driver'),('Mercedes','car')]:
                await page.goto('https://fantasygp.com/team/',wait_until='domcontentloaded',timeout=60000)
                await page.wait_for_timeout(1500)
                loc=page.get_by_text(label,exact=True)
                for i in range(await loc.count()):
                  try:
                    el=loc.nth(i)
                    if await el.is_visible():
                      h=await el.element_handle()
                      clicked=await page.evaluate("""e=>{let n=e;for(let j=0;j<7&&n;j++,n=n.parentElement){if(n.onclick||n.tagName==='BUTTON'||n.tagName==='A'||n.getAttribute('role')==='button'||[...n.attributes].some(a=>a.name.startsWith('data-'))){n.click();return true}}return false}""",h)
                      if clicked:
                        await page.wait_for_timeout(1200); break
                  except Exception: pass
                body=await page.locator('body').inner_text()
                (OUT/f'{kind}-modal.txt').write_text(body,encoding='utf-8')
                (OUT/f'{kind}-modal.html').write_text(await page.content(),encoding='utf-8')
                await page.screenshot(path=str(OUT/f'{kind}-modal.png'),full_page=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fantasygp-current-state
          path: build/current-state/
          retention-days: 1
