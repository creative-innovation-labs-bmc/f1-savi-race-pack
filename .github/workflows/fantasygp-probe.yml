name: Phase 2 FantasyGP probe

on:
  workflow_dispatch:
  push:
    branches: ["build/phase-2"]
    paths:
      - "scripts/fantasygp_probe.py"
      - "scripts/fantasygp_probe_runner.py"
      - ".github/workflows/fantasygp-probe.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/fantasygp_probe.py"
      - "scripts/fantasygp_probe_runner.py"
      - ".github/workflows/fantasygp-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      FANTASYGP_LEAGUE_URL: https://fantasygp.com/league/?lid=10527
      FANTASYGP_PROBE_OUTPUT: build/fantasygp-probe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm encrypted secrets exist
        shell: bash
        run: |
          if [[ -z "$FANTASYGP_USERNAME" || -z "$FANTASYGP_PASSWORD" ]]; then
            echo "Required FantasyGP repository secrets are missing."
            exit 1
          fi

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Probe authenticated league page
        id: probe
        continue-on-error: true
        run: python scripts/fantasygp_probe_runner.py

      - name: Upload sanitised diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fantasygp-phase-2-probe
          path: build/fantasygp-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce probe result
        if: steps.probe.outcome != 'success'
        run: |
          echo "FantasyGP probe failed. Download the diagnostic artifact for review."
          exit 1
