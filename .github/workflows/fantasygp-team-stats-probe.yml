name: FantasyGP team-stats probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-team-stats-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture team stats read-only
        shell: bash
        run: |
          mkdir -p build/team-stats
          python - <<'PY'
          import asyncio, os, sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'scripts')
          from fantasygp_auth_runner import authenticated_login
          OUT=Path('build/team-stats')
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True); c=await b.new_context(viewport={'width':1600,'height':1300}); page=await c.new_page()
              await authenticated_login(page,league_url='https://fantasygp.com/league/?lid=10527',username=os.environ['FANTASYGP_USERNAME'],password=os.environ['FANTASYGP_PASSWORD'])
              await page.goto('https://fantasygp.com/stats/',wait_until='domcontentloaded',timeout=60000); await page.wait_for_timeout(2500)
              await page.select_option('#ffgp-datatype-select','car'); await page.wait_for_timeout(2500)
              body=await page.locator('body').inner_text()
              (OUT/'teams.txt').write_text(body,encoding='utf-8')
              await page.screenshot(path=str(OUT/'teams.png'),full_page=True)
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fantasygp-team-stats
          path: build/team-stats/
          retention-days: 1
