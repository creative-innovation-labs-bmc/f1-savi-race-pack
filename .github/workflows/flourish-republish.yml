name: Flourish republish

on:
  push:
    branches: [main]
    paths:
      - data/flourish/republish-request.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flourish-republish
  cancel-in-progress: false

jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      FLOURISH_EMAIL: ${{ secrets.FLOURISH_EMAIL }}
      FLOURISH_PASSWORD: ${{ secrets.FLOURISH_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm encrypted Flourish secrets exist
        shell: bash
        run: |
          if [[ -z "$FLOURISH_EMAIL" || -z "$FLOURISH_PASSWORD" ]]; then
            echo "Required Flourish repository secrets are missing: FLOURISH_EMAIL and/or FLOURISH_PASSWORD."
            exit 1
          fi

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Republish F1 SAVI Flourish charts
        run: |
          python scripts/flourish_republish_v2.py \
            --visualisation 23536150 \
            --visualisation 23537908 \
            --diagnostics build/flourish-republish/diagnostics

      - name: Upload republish diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flourish-republish-diagnostics
          path: build/flourish-republish/diagnostics/
          if-no-files-found: ignore
          retention-days: 14
