name: FantasyGP stats probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-stats-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture current FantasyGP stats read-only
        shell: bash
        run: |
          mkdir -p build/stats-probe
          python - <<'PY'
          import asyncio,json,os,sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'scripts')
          from fantasygp_auth_runner import authenticated_login
          OUT=Path('build/stats-probe')
          async def main():
            async with async_playwright() as p:
              b=await p.chromium.launch(headless=True); c=await b.new_context(); page=await c.new_page()
              await authenticated_login(page,league_url='https://fantasygp.com/league/?lid=10527',username=os.environ['FANTASYGP_USERNAME'],password=os.environ['FANTASYGP_PASSWORD'])
              await page.goto('https://fantasygp.com/stats/',wait_until='domcontentloaded',timeout=60000); await page.wait_for_timeout(2000)
              async def ajax(action,params):
                return await page.evaluate('''({action,params}) => new Promise(resolve => { jQuery.ajax({url: 'https://fantasygp.com/wp-admin/admin-ajax.php', method:'POST', data:{action,...params}, success:r=>resolve(r), error:x=>resolve({error:true,status:x.status,text:x.responseText})}); })''',{'action':action,'params':params})
              drivers=await ajax('ffgp_get_stats',{'season':'2026','data_type':'driver'})
              cars=await ajax('ffgp_get_stats',{'season':'2026','data_type':'car'})
              markets=await ajax('ffgp_get_markets',{})
              quick=await ajax('ffgp_get_quickstats',{})
              (OUT/'drivers.json').write_text(json.dumps(drivers,indent=2,ensure_ascii=False),encoding='utf-8')
              (OUT/'cars.json').write_text(json.dumps(cars,indent=2,ensure_ascii=False),encoding='utf-8')
              (OUT/'markets.json').write_text(json.dumps(markets,indent=2,ensure_ascii=False),encoding='utf-8')
              (OUT/'quickstats.json').write_text(json.dumps(quick,indent=2,ensure_ascii=False),encoding='utf-8')
              await b.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fantasygp-stats-probe
          path: build/stats-probe/
          retention-days: 1
