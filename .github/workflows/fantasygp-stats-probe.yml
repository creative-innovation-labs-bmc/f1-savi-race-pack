name: FantasyGP stats probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-stats-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture stats read-only
        shell: bash
        run: |
          mkdir -p build/stats-probe
          python - <<'PY'
          import asyncio, json, os, sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'scripts')
          from fantasygp_auth_runner import authenticated_login
          OUT=Path('build/stats-probe')
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch(headless=True)
              ctx=await browser.new_context(viewport={'width':1600,'height':1200})
              page=await ctx.new_page()
              await authenticated_login(page,league_url='https://fantasygp.com/league/?lid=10527',username=os.environ['FANTASYGP_USERNAME'],password=os.environ['FANTASYGP_PASSWORD'])
              for name,url in [('stats','https://fantasygp.com/stats/'),('history','https://fantasygp.com/team-history/')]:
                await page.goto(url,wait_until='domcontentloaded',timeout=60000)
                await page.wait_for_timeout(2500)
                body=await page.locator('body').inner_text()
                html=await page.content()
                els=await page.evaluate('''() => [...document.querySelectorAll('table,select,button,a,input,[data-toggle],[data-target]')].map(e=>({tag:e.tagName,text:(e.innerText||e.value||'').trim().slice(0,500),id:e.id||'',cls:e.className||'',attrs:Object.fromEntries([...e.attributes].map(a=>[a.name,a.value]))}))''')
                (OUT/f'{name}.txt').write_text(body,encoding='utf-8')
                (OUT/f'{name}.html').write_text(html,encoding='utf-8')
                (OUT/f'{name}-elements.json').write_text(json.dumps(els,indent=2,ensure_ascii=False),encoding='utf-8')
                await page.screenshot(path=str(OUT/f'{name}.png'),full_page=True)
              await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fantasygp-stats-probe
          path: build/stats-probe/
          retention-days: 1
