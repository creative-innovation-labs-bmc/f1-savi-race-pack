name: Flourish data sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/season2/individual.csv
      - data/season2/cumulative.csv
      - scripts/flourish_sync.py
      - .github/workflows/flourish-sync.yml

permissions:
  contents: read

concurrency:
  group: flourish-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLOURISH_EMAIL: \${{ secrets.FLOURISH_EMAIL }}
      FLOURISH_PASSWORD: \${{ secrets.FLOURISH_PASSWORD }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Confirm encrypted Flourish secrets exist
        shell: bash
        run: |
          if [[ -z "$FLOURISH_EMAIL" || -z "$FLOURISH_PASSWORD" ]]; then
            echo "Required Flourish repository secrets are missing."
            exit 1
          fi

      - name: Validate Python
        run: python -m compileall -q scripts/flourish_sync.py

      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium

      - name: Upload canonical data and publish Flourish
        run: |
          python scripts/flourish_sync.py \
            --races data/season2/individual.csv \
            --leaderboard data/season2/cumulative.csv \
            --expected-competitors 46 \
            --diagnostics build/flourish-sync/diagnostics

      - name: Upload sync diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: flourish-sync-diagnostics
          path: build/flourish-sync/
          if-no-files-found: ignore
          retention-days: 14
