name: FantasyGP moneyball probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-moneyball-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture current FantasyGP account state read-only
        shell: bash
        run: |
          mkdir -p build/moneyball-probe
          python - <<'PY'
          import asyncio, json, os, sys
          from pathlib import Path
          from playwright.async_api import async_playwright
          sys.path.insert(0,'scripts')
          from fantasygp_auth_runner import authenticated_login

          OUT=Path('build/moneyball-probe')
          LEAGUE='https://fantasygp.com/league/?lid=10527'

          async def snap(page,name,url):
              resp=await page.goto(url,wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(2500)
              body=await page.locator('body').inner_text()
              (OUT/f'{name}.txt').write_text(body,encoding='utf-8')
              (OUT/f'{name}.html').write_text(await page.content(),encoding='utf-8')
              await page.screenshot(path=str(OUT/f'{name}.png'),full_page=True)
              return {'url':page.url,'status':resp.status if resp else None,'body':body[:50000]}

          async def open_modal(page,label,kind):
              await page.goto('https://fantasygp.com/team/',wait_until='domcontentloaded',timeout=60000)
              await page.wait_for_timeout(1500)
              loc=page.get_by_text(label,exact=True)
              clicked=False
              for i in range(await loc.count()):
                  try:
                      el=loc.nth(i)
                      if await el.is_visible():
                          h=await el.element_handle()
                          clicked=await page.evaluate("""e=>{let n=e;for(let j=0;j<8&&n;j++,n=n.parentElement){if(n.onclick||n.tagName==='BUTTON'||n.tagName==='A'||n.getAttribute('role')==='button'||[...n.attributes].some(a=>a.name.startsWith('data-'))){n.click();return true}}return false}""",h)
                          if clicked:
                              await page.wait_for_timeout(1200)
                              break
                  except Exception:
                      pass
              body=await page.locator('body').inner_text()
              (OUT/f'{kind}-modal.txt').write_text(body,encoding='utf-8')
              (OUT/f'{kind}-modal.html').write_text(await page.content(),encoding='utf-8')
              await page.screenshot(path=str(OUT/f'{kind}-modal.png'),full_page=True)
              return {'label':label,'kind':kind,'clicked':clicked,'body':body[:50000]}

          async def main():
            async with async_playwright() as p:
                browser=await p.chromium.launch(headless=True)
                ctx=await browser.new_context(viewport={'width':1600,'height':1300})
                page=await ctx.new_page()
                auth=await authenticated_login(page,league_url=LEAGUE,username=os.environ['FANTASYGP_USERNAME'],password=os.environ['FANTASYGP_PASSWORD'])
                result={'auth':auth}
                result['league']=await snap(page,'league',LEAGUE)
                result['team']=await snap(page,'team','https://fantasygp.com/team/')
                result['predictions']=await snap(page,'predictions','https://fantasygp.com/predictions/')
                result['stats']=await snap(page,'stats','https://fantasygp.com/stats/')
                result['driver_modal']=await open_modal(page,'Antonelli','driver')
                result['car_modal']=await open_modal(page,'Mercedes','car')
                (OUT/'summary.json').write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding='utf-8')
                await browser.close()
          asyncio.run(main())
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: fantasygp-moneyball-probe
          path: build/moneyball-probe/
          retention-days: 1
