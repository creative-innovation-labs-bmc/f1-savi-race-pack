name: FantasyGP account probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fantasygp-account-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FANTASYGP_USERNAME: ${{ secrets.FANTASYGP_USERNAME }}
      FANTASYGP_PASSWORD: ${{ secrets.FANTASYGP_PASSWORD }}
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - name: Capture FantasyGP account state read-only
        shell: bash
        run: |
          mkdir -p build/account-probe
          python - <<'PY'
          import asyncio, json, os, sys
          from pathlib import Path
          from playwright.async_api import async_playwright

          sys.path.insert(0, 'scripts')
          from fantasygp_auth_runner import authenticated_login

          OUT = Path('build/account-probe')
          LEAGUE = 'https://fantasygp.com/league/?lid=10527'
          USER = os.environ['FANTASYGP_USERNAME']
          PASS = os.environ['FANTASYGP_PASSWORD']

          async def snap(page, name, url):
              resp = await page.goto(url, wait_until='domcontentloaded', timeout=60000)
              await page.wait_for_timeout(2500)
              body = await page.locator('body').inner_text()
              html = await page.content()
              elements = await page.evaluate('''() => [...document.querySelectorAll('*')].map((e,i) => {
                const t=(e.innerText||'').trim();
                const attrs={}; for (const a of e.attributes||[]) attrs[a.name]=a.value;
                const interesting = e.onclick || Object.keys(attrs).some(k => k.startsWith('data-')) ||
                  ['BUTTON','A','SELECT','OPTION','INPUT'].includes(e.tagName) ||
                  /(Antonelli|Gasly|Lindblad|Mercedes|McLaren|Alpine|Select Driver|Select Car)/i.test(t);
                if (!interesting) return null;
                return {i,tag:e.tagName,text:t.slice(0,220),id:e.id||'',cls:e.className||'',attrs};
              }).filter(Boolean)''')
              (OUT/f'{name}.txt').write_text(body, encoding='utf-8')
              (OUT/f'{name}.html').write_text(html, encoding='utf-8')
              (OUT/f'{name}-elements.json').write_text(json.dumps(elements,indent=2,ensure_ascii=False),encoding='utf-8')
              await page.screenshot(path=str(OUT/f'{name}.png'), full_page=True)
              return {'url':page.url,'status':resp.status if resp else None,'title':await page.title(),'body':body[:30000]}

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(viewport={'width':1440,'height':1100})
                  page = await context.new_page()
                  auth = await authenticated_login(page, league_url=LEAGUE, username=USER, password=PASS)
                  pit = await snap(page,'pitwall','https://fantasygp.com/pitwall/')
                  team = await snap(page,'team','https://fantasygp.com/team/')
                  pred = await snap(page,'predictions','https://fantasygp.com/predictions/')

                  # Click the current driver and car tiles only to open selection modals. Do not select or save anything.
                  modal_results=[]
                  for label, kind in [('Antonelli','driver'),('Mercedes','car')]:
                      await page.goto('https://fantasygp.com/team/', wait_until='domcontentloaded', timeout=60000)
                      await page.wait_for_timeout(1500)
                      loc = page.get_by_text(label, exact=True)
                      clicked=False
                      for idx in range(await loc.count()):
                          try:
                              el=loc.nth(idx)
                              if await el.is_visible():
                                  # Walk to nearest clickable ancestor if needed.
                                  target=el
                                  handle=await el.element_handle()
                                  info=await page.evaluate('''e => { let n=e; for(let j=0;j<6 && n;j++,n=n.parentElement){ if(n.onclick || n.tagName==='BUTTON' || n.tagName==='A' || n.getAttribute('role')==='button' || [...n.attributes].some(a=>a.name.startsWith('data-'))) return {tag:n.tagName,id:n.id,cls:n.className,html:n.outerHTML.slice(0,1500)};} return null;}''',handle)
                                  if info:
                                      # click ancestor by JS to avoid selector ambiguity
                                      await page.evaluate('''e => { let n=e; for(let j=0;j<6 && n;j++,n=n.parentElement){ if(n.onclick || n.tagName==='BUTTON' || n.tagName==='A' || n.getAttribute('role')==='button' || [...n.attributes].some(a=>a.name.startsWith('data-'))){ n.click(); return true; }} return false;}''',handle)
                                      await page.wait_for_timeout(1200)
                                      clicked=True
                                      break
                          except Exception:
                              pass
                      body=await page.locator('body').inner_text()
                      (OUT/f'{kind}-modal.txt').write_text(body,encoding='utf-8')
                      (OUT/f'{kind}-modal.html').write_text(await page.content(),encoding='utf-8')
                      await page.screenshot(path=str(OUT/f'{kind}-modal.png'),full_page=True)
                      modal_results.append({'label':label,'kind':kind,'clicked':clicked,'body':body[:30000]})

                  (OUT/'summary.json').write_text(json.dumps({'auth':auth,'pit':pit,'team':team,'predictions':pred,'modals':modal_results},indent=2,ensure_ascii=False),encoding='utf-8')
                  await browser.close()

          asyncio.run(main())
          PY
      - name: Upload read-only probe
        uses: actions/upload-artifact@v6
        with:
          name: fantasygp-account-probe
          path: build/account-probe/
          retention-days: 1
