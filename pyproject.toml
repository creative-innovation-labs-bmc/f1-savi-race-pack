[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-savi-race-pack"
version = "0.1.0"
description = "Validated race-pack generator for the F1 SAVI League"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
f1-savi = "f1_savi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
